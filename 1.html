<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Beni Seviyor Musun?</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link href="style.css" rel="stylesheet">
</head> 
<body>
<div id="stage" class="konteyner">
  <div id="hearts" aria-hidden="true"></div>
  <img src="C:\Users\talha\OneDrive\Desktop\Yeni klasör\1000076364.png" alt="" class="img1">
  <img src="C:\Users\talha\OneDrive\Desktop\Yeni klasör\1000074970.jpg" alt="" class="img2">
  <img src="C:\Users\talha\OneDrive\Desktop\Yeni klasör\IMG_3023.png" class="img3">
  <img src="C:\Users\talha\OneDrive\Desktop\Yeni klasör\IMG_3031.png" alt="" class="img4">



  <label class="field"><b>♥</b><input id="answer" type="text" placeholder="(evet/hayır)" autocomplete="off" aria-label="Cevabın"></label>
  <button class="btn" id="send" type="button">♥&nbsp; Gönder</button>

  <section class="result" id="result" aria-live="polite">
    <div class="ic" id="ic">🔒</div>
    <div class="row">
      <svg viewBox="0 0 140 34"><path d="M0 17h52l5-9 6 21 6-17 4 5h61"/></svg>
      <h2 id="ttl2">Henüz cevap verilmedi...</h2>
      <svg viewBox="0 0 140 34"><path d="M0 17h52l5-9 6 21 6-17 4 5h61"/></svg>
    </div>
    <p id="desc">Doğru cevabı gir ve sonucu gör.</p>
  </section>

  <div class="player">
    <button class="play" id="play" aria-label="Oynat / Duraklat">❚❚</button>
    <div class="ttl">SENDEN DAHA GÜZEL</div>
    <div class="prog"><i id="bar"></i></div>
    <input class="vol" id="vol" type="range" min="0" max="1" step="0.05" value="0.6" aria-label="Ses">
    <div class="spk" id="spk">🔊</div>
  </div>
</div>

<script>
/* ---- Sahneyi ekrana sığdır ---- */
const stage=document.getElementById('stage');
function fit(){
  const k=Math.min(innerWidth/1536,innerHeight/1024);
  stage.style.transform=`scale(${k}) translate(-50%,-50%)`;
  stage.style.transformOrigin='0 0';
  stage.style.left='50%';stage.style.top='50%';
}
/* translate(-50%,-50%) ölçekten sonra uygulanır -> merkezleme */
addEventListener('resize',fit);fit();

/* ---- Yüzen kalplar ---- */
const box=document.getElementById('hearts');
for(let i=0;i<26;i++){
  const h=document.createElement('span');h.className='heart';h.textContent='♥';
  h.style.left=Math.random()*1500+'px';h.style.fontSize=(10+Math.random()*24)+'px';
  h.style.animationDuration=(10+Math.random()*14)+'s';h.style.animationDelay=(-Math.random()*20)+'s';
  box.appendChild(h);
}

/* ---- Cevap mantığı ---- */
const input=document.getElementById('answer'),result=document.getElementById('result'),
ic=document.getElementById('ic'),t2=document.getElementById('ttl2'),desc=document.getElementById('desc');
function submit(){
  const a=input.value.trim().toLocaleLowerCase('tr');
  result.classList.remove('yes','no','shake');void result.offsetWidth;
  if(a==='evet'){result.classList.add('yes');ic.textContent='❤️';t2.textContent='AŞKIMMM BENDE SENi ÇOOOK SEVİYORUMMMM';desc.textContent='Aşk her zaman kazanır. ♥';}
  else if(a==='hayır'||a==='hayir'){result.classList.add('no');ic.textContent='💔';t2.textContent='SEVİYORSUNNN SUSSS';desc.textContent='Kalbim kırıldı ama vazgeçmem. Tekrar dene.';}
  else{result.classList.add('shake');ic.textContent='🔒';t2.textContent='Henüz cevap verilmedi...';desc.textContent='Doğru cevabı gir (evet/hayır) ve sonucu gör.';}
}
document.getElementById('send').onclick=submit;
input.addEventListener('keydown',e=>{if(e.key==='Enter')submit()});

/* ---- Müzik: dosya gerekmez, Web Audio ile çalınır ----
   Kendi şarkını kullanmak istersen MP3 değişkenine dosya yolunu yaz. */
const MP3='şarkı.mp3';
const AC=window.AudioContext||window.webkitAudioContext;
let ctx,master,wantPlay=true,started=false,timer,nextT=0,barIdx=0,t0=0,audioEl;
const mtof=m=>440*Math.pow(2,(m-69)/12);
const BPM=68,beat=60/BPM,bar=beat*4,eighth=beat/2;
const chords=[[57,60,64],[53,57,60],[60,64,67],[55,59,62]];     // Am F C G
const bass=[45,41,48,43];
const mel=[ // [adım(8'lik), nota, uzunluk]
 [[0,76,3],[3,79,1],[4,77,2],[6,76,2]],
 [[0,72,3],[3,74,1],[4,77,4]],
 [[0,79,3],[3,76,1],[4,74,2],[6,72,2]],
 [[0,71,2],[2,74,2],[4,72,4]]
];
function note(f,t,d,type,vol){
  const o=ctx.createOscillator(),g=ctx.createGain();
  o.type=type;o.frequency.value=f;
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.015);
  g.gain.exponentialRampToValueAtTime(.0008,t+d);
  o.connect(g);g.connect(master);g.connect(fx);o.start(t);o.stop(t+d+.05);
}
let fx;
function build(){
  ctx=new AC();master=ctx.createGain();master.gain.value=+document.getElementById('vol').value*.8;
  const comp=ctx.createDynamicsCompressor();master.connect(comp);comp.connect(ctx.destination);
  fx=ctx.createGain();fx.gain.value=.35;                       // yankı (reverb hissi)
  const dl=ctx.createDelay(1),fb=ctx.createGain(),lp=ctx.createBiquadFilter();
  dl.delayTime.value=beat*.75;fb.gain.value=.45;lp.type='lowpass';lp.frequency.value=2200;
  fx.connect(dl);dl.connect(lp);lp.connect(fb);fb.connect(dl);lp.connect(master);
}
function schedule(){
  while(nextT<ctx.currentTime+.6){
    const c=barIdx%4,ch=chords[c],arp=[0,1,2,1,2,1,2,1];
    note(mtof(bass[c]),nextT,bar*.95,'sine',.28);
    arp.forEach((k,i)=>note(mtof(ch[k]+12),nextT+i*eighth,eighth*3,'triangle',.11));
    mel[c].forEach(([s,m,l])=>note(mtof(m),nextT+s*eighth,l*eighth*1.3,'sine',.16));
    nextT+=bar;barIdx++;
  }
}
function startSynth(){
  if(!ctx)build();
  ctx.resume();
  if(!started){started=true;nextT=ctx.currentTime+.1;t0=ctx.currentTime;timer=setInterval(()=>{if(ctx.state==='running')schedule()},150);}
}
function startMusic(){
  if(MP3){audioEl=audioEl||Object.assign(new Audio(MP3),{loop:true,volume:+vol.value});audioEl.play().catch(()=>{});}
  else startSynth();
}
function stopMusic(){ if(MP3){audioEl&&audioEl.pause();} else if(ctx)ctx.suspend(); }
const playBtn=document.getElementById('play'),vol=document.getElementById('vol'),bar2=document.getElementById('bar');
function sync(){playBtn.textContent=wantPlay?'❚❚':'▶';}
playBtn.onclick=e=>{e.stopPropagation();wantPlay=!wantPlay;wantPlay?startMusic():stopMusic();sync();};
vol.oninput=()=>{if(master)master.gain.value=vol.value*.8;if(audioEl)audioEl.volume=vol.value;};
document.getElementById('spk').onclick=()=>{vol.value=+vol.value?0:.6;vol.oninput();};
/* İlerleme çubuğu (döngü: 4 ölçü) */
setInterval(()=>{
  if(!ctx||ctx.state!=='running')return;
  bar2.style.width=(((ctx.currentTime-t0)%(bar*4))/(bar*4)*100)+'%';
},200);
/* Otomatik başlatmayı dene; tarayıcı engellerse ilk dokunuşta başlar */
if(wantPlay){try{startMusic()}catch(e){}}
['pointerdown','keydown','touchstart'].forEach(ev=>addEventListener(ev,()=>{
  if(wantPlay&&(!ctx||ctx.state!=='running')&&!MP3)startMusic();
  if(wantPlay&&MP3&&audioEl&&audioEl.paused)startMusic();
},{passive:true}));
</script>
</body>
</html>
